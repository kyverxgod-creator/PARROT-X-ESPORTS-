
name: Build Parrot x eSports APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "parrot_x_esports_v1.zip" ]; then
            echo "ERROR: parrot_x_esports_v1.zip not found."
            echo "Check the ZIP filename in the repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -o parrot_x_esports_v1.zip -d extracted

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find extracted -type f -name pubspec.yaml -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No pubspec.yaml found in the ZIP."
            echo "The ZIP must contain a Flutter project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project found at: $PROJECT_DIR"
          cat "$PROJECT_FILE"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Get dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Parrot-x-eSports-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
