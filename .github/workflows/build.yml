
name: Build Parrot x eSports APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project ZIP
        run: |
          unzip -o parrot_x_esports_v1.zip -d extracted

      - name: Locate Flutter project
        run: |
          find extracted -name pubspec.yaml -print

      - name: Prepare Android project
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name pubspec.yaml -print -quit)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          rm -rf "$PROJECT_DIR/android"
          flutter create "$PROJECT_DIR" --platforms=android

      - name: Get dependencies
        run: flutter pub get --directory "$PROJECT_DIR"

      - name: Build APK
        run: flutter build apk --release --project-dir "$PROJECT_DIR"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Parrot-x-eSports-APK
          path: extracted/**/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
