name: Build Parrot x eSports APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project ZIP
        run: unzip -o parrot_x_esports_v1.zip

      - name: Prepare Android project
        working-directory: parrot_x_esports
        run: flutter create . --platforms=android

      - name: Get dependencies
        working-directory: parrot_x_esports
        run: flutter pub get

      - name: Build APK
        working-directory: parrot_x_esports
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Parrot-x-eSports-APK
          path: parrot_x_esports/build/app/outputs/flutter-apk/app-release.apk
